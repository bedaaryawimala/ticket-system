{% extends 'base.html' %}
{% block title %}Lupa kata sandi{% endblock %}
{% block content %}
<section class="login-wrap">
  <p class="section-note">Pemulihan akun</p>
  <h1>Lupa kata sandi?</h1>
  <p class="muted">Masukkan email akun. Pada demo lokal, kode reset masuk ke kotak surat lokal, bukan ke Gmail.</p>
  <form class="form-panel login-form" method="post" action="{{ url_for('auth.forgot_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required>
    <button class="button primary" type="submit">Minta kode reset</button>
  </form>
  <p class="auth-links"><a href="{{ url_for('auth.login') }}">Kembali ke masuk</a></p>
</section>
{% endblock %}
