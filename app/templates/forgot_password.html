{% extends 'base.html' %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<section class="login-wrap">
  <p class="section-note">Account recovery</p>
  <h1>Forgot your password?</h1>
  <p class="muted">Enter your account email. This local demo saves reset codes to a local outbox and does not send email.</p>
  <form class="form-panel login-form" method="post" action="{{ url_for('auth.forgot_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required>
    <button class="button primary" type="submit">Request reset code</button>
  </form>
  <p class="auth-links"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p>
</section>
{% endblock %}
