{% extends 'base.html' %}
{% block title %}Ganti kata sandi{% endblock %}
{% block content %}
<section class="login-wrap">
  <p class="section-note">Pemulihan akun</p>
  <h1>Ganti kata sandi</h1>
  <p class="muted">Masukkan kode dari kotak surat demo dan kata sandi baru.</p>
  {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
  <form class="form-panel login-form" method="post" action="{{ url_for('auth.reset_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="code">Kode reset</label>
    <input id="code" name="code" value="{{ code or '' }}" maxlength="128" autocomplete="one-time-code" required>
    <label for="password">Kata sandi baru</label>
    <input id="password" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
    <label for="password_confirm">Ulangi kata sandi baru</label>
    <input id="password_confirm" name="password_confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
    <button class="button primary" type="submit">Simpan kata sandi baru</button>
  </form>
  <p class="auth-links"><a href="{{ url_for('auth.forgot_password') }}">Minta kode lain</a></p>
</section>
{% endblock %}
