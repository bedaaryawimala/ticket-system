{% extends 'base.html' %}
{% block title %}Reset password{% endblock %}
{% block content %}
<section class="login-wrap">
  <p class="section-note">Account recovery</p>
  <h1>Set a new password</h1>
  <p class="muted">Enter the code from the demo outbox and choose a new password.</p>
  {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
  <form class="form-panel login-form" method="post" action="{{ url_for('auth.reset_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="code">Reset code</label>
    <input id="code" name="code" value="{{ code or '' }}" maxlength="128" autocomplete="one-time-code" required>
    <label for="password">New password</label>
    <input id="password" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
    <label for="password_confirm">Confirm new password</label>
    <input id="password_confirm" name="password_confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
    <button class="button primary" type="submit">Save new password</button>
  </form>
  <p class="auth-links"><a href="{{ url_for('auth.forgot_password') }}">Request another code</a></p>
</section>
{% endblock %}
