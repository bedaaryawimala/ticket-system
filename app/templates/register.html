{% extends 'base.html' %}
{% block title %}Buat akun{% endblock %}
{% block content %}
<section class="login-wrap">
  <p class="section-note">Akun pelapor</p>
  <h1>Buat akun</h1>
  <p class="muted">Akun baru hanya dapat membuat dan melihat tiket miliknya. Email belum diverifikasi pada demo lokal.</p>
  {% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}
  <form class="form-panel login-form" method="post" action="{{ url_for('auth.register') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="display_name">Nama</label>
    <input id="display_name" name="display_name" value="{{ name or '' }}" maxlength="80" autocomplete="name" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email or '' }}" maxlength="254" autocomplete="email" required>
    <label for="password">Kata sandi</label>
    <input id="password" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
    <label for="password_confirm">Ulangi kata sandi</label>
    <input id="password_confirm" name="password_confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
    <button class="button primary" type="submit">Buat akun</button>
  </form>
  <p class="auth-links"><a href="{{ url_for('auth.login') }}">Sudah punya akun? Masuk</a></p>
</section>
{% endblock %}
